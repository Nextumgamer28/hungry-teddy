<!DOCTYPE html>
<html>
<body>
<svg viewBox="0 0 400 400">
  <circle cx="200" cy="200" r="100" fill="orange"/>
  <g id="eye" style="clip-path: inset(0% 0 0 0); transition: clip-path 1.5s ease;">
     <circle cx="200" cy="200" r="50" fill="black"/>
     <circle cx="180" cy="180" r="10" fill="white"/>
  </g>
</svg>
<style>
  .closed { clip-path: inset(100% 0 0 0) !important; }
</style>
<script>
  setTimeout(() => document.getElementById('eye').classList.add('closed'), 1000);
</script>
</body>
</html>
